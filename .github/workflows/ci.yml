name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Includes TestCommandReference, which fails if the docs command
      # reference is out of date with the CLI's help text.
      - run: go test ./...
