name: An endpoint changed
description: A command broke because Chekin's API returned something different.
labels: [api-change]
body:
  - type: markdown
    attributes:
      value: |
        chekin-cli uses the dashboard's undocumented API, which can change without
        notice. This issue is public. Remove your token and any guest data before
        you submit, and don't attach HAR files.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `chekin version`.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command that broke
      description: The exact command you ran.
      render: sh
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: HTTP status
      placeholder: "404"
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Error message
      description: What the CLI printed, including the API's message if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: dashboard
    attributes:
      label: What the dashboard does now
      description: |
        Optional. If you checked the Network tab in DevTools, the method and path the
        dashboard calls now, and the field names that changed. No values from real bookings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my token and any guest data
          required: true
