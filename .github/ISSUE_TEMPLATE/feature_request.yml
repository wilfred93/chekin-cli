name: Feature request
description: Something the CLI should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do
      description: The task, in terms of the Chekin dashboard if that helps. For example, "mark a booking's guests as checked in".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In the dashboard, with a script, or not at all.
  - type: textarea
    id: command
    attributes:
      label: Command you'd like
      description: Optional. What you'd type.
      render: sh
